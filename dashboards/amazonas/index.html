<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazonas · Dashboards ELDE</title>
<link rel="stylesheet" href="/dashboards/shared/estilo.css">
<style>:root { --acento: #9b59b6; }</style>
</head>
<body>
<header>
  <h1>📹 Amazonas — personal y visitantes</h1>
  <span class="sub"><a href="/dashboards/" style="color:var(--apagado)">← todos los dashboards</a></span>
  <span class="refresco"></span>
</header>

<nav class="paneles" id="paneles"></nav>

<div class="kpis">
  <div class="kpi"><div class="valor" data-kpi="camaras">—</div><div class="nombre">cámaras del dominio</div></div>
  <div class="kpi"><div class="valor" data-kpi="frames">—</div><div class="nombre">frames recibidos</div></div>
  <div class="kpi"><div class="valor" data-kpi="galeria">—</div><div class="nombre">personas en galería</div></div>
  <div class="kpi"><div class="valor" data-kpi="visitantes">—</div><div class="nombre">visitantes únicos</div></div>
</div>

<section>
  <h2>Cámaras de Amazonas</h2>
  <div class="tarjeta" id="dispositivos"></div>
</section>

<section>
  <h2>Analítica por cámara</h2>
  <div class="tarjeta" id="analitica"></div>
</section>

<script src="/dashboards/shared/api.js"></script>
<script>
async function pintarPaneles() {
  const enlaces = await API.paneles();
  const nav = document.getElementById('paneles');
  const partes = [];
  if (enlaces.vigilante) partes.push(`<a href="${enlaces.vigilante}" target="_blank">🖼️ Galería de personas de interés</a>`);
  if (enlaces.visitantes) partes.push(`<a href="${enlaces.visitantes}" target="_blank">👥 Analítica de visitantes</a>`);
  nav.innerHTML = partes.join('');
}
pintarPaneles().catch(console.error);

refrescar(async () => {
  const [dispositivos, { resumen }] = await Promise.all([
    API.leer('dispositivos?client_type=amazonas'),
    API.leer('resumen'),
  ]);

  const filas = dispositivos.dispositivos;
  UI.kpis({
    camaras: dispositivos.total,
    frames: filas.reduce((s, d) => s + (d.frames || 0), 0),
    galeria: resumen.galeria_total,
    visitantes: resumen.visitantes_unicos,
  });

  UI.tabla('dispositivos', filas, [
    ['device_id', 'dispositivo'],
    ['camera_name', 'cámara'],
    ['pipelines', 'pipelines', v => UI.esc((v || []).join(', ') || '—')],
    ['frames', 'frames'],
    ['ultima_vez', 'última vez', v => UI.fecha(v)],
  ]);

  // Analitica por camara: se pide SOLO para las camaras del dominio, y una
  // que aun no tenga informe no es un error, es "todavia no".
  const cont = document.getElementById('analitica');
  const partes = [];
  for (const d of filas.slice(0, 8)) {
    try {
      const a = await API.leer(`analitica/${encodeURIComponent(d.device_id)}`);
      const x = a.datos || {};
      partes.push({
        device_id: d.device_id,
        visitantes: x.visitantes_unicos ?? '—',
        entradas: x.total_entradas ?? '—',
        permanencia: x.permanencia_media_s != null ? `${Number(x.permanencia_media_s).toFixed(1)} s` : '—',
        sesiones: a.sesiones_disponibles,
      });
    } catch (e) {
      partes.push({ device_id: d.device_id, visitantes: '—', entradas: '—',
                    permanencia: 'sin informe todavía', sesiones: 0 });
    }
  }
  UI.tabla(cont, partes, [
    ['device_id', 'dispositivo'],
    ['visitantes', 'visitantes'],
    ['entradas', 'entradas'],
    ['permanencia', 'permanencia media'],
    ['sesiones', 'sesiones'],
  ]);
}, 20);
</script>
</body>
</html>
