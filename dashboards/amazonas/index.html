<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazonas · Dashboards ELDE</title>
<link rel="stylesheet" href="/dashboards/shared/estilo.css">
<style>:root { --acento: #9b59b6; }</style>
</head>
<body>
<header>
  <h1>📹 Amazonas — personas, género y edad</h1>
  <span class="sub"><a href="/dashboards/" style="color:var(--apagado)">← todos los dashboards</a></span>
  <span class="refresco"></span>
</header>

<nav class="paneles" id="paneles"></nav>

<div class="kpis">
  <div class="kpi"><div class="valor" data-kpi="personas">—</div><div class="nombre">personas detectadas</div></div>
  <div class="kpi"><div class="valor" data-kpi="mujeres">—</div><div class="nombre">mujeres</div></div>
  <div class="kpi"><div class="valor" data-kpi="hombres">—</div><div class="nombre">hombres</div></div>
  <div class="kpi"><div class="valor" data-kpi="sinIdentificar">—</div><div class="nombre">sin género conocido</div></div>
  <div class="kpi"><div class="valor" data-kpi="capturas">—</div><div class="nombre">capturas</div></div>
</div>

<section>
  <h2>Desglose por género y edad</h2>
  <div class="rejilla2">
    <div class="tarjeta"><h2>Género</h2><div class="barras" id="genero"></div></div>
    <div class="tarjeta"><h2>Edad</h2><div class="barras" id="edad"></div></div>
  </div>
</section>

<section>
  <h2>Capturas por género y edad</h2>
  <div class="tarjeta" id="cruce"></div>
</section>

<section>
  <h2>Detección de personas</h2>
  <div class="galeria" id="capturas"></div>
  <div class="paginacion">
    <button id="mas" class="boton">Cargar más</button>
    <span class="vacio" id="mas-nota"></span>
  </div>
</section>

<section>
  <h2>Mapas de calor</h2>
  <div class="heatmaps" id="heatmaps"></div>
</section>

<section>
  <h2>Cámaras de Amazonas</h2>
  <div class="tarjeta" id="dispositivos"></div>
</section>

<section>
  <h2>Analítica por cámara</h2>
  <div class="tarjeta" id="analitica"></div>
</section>

<script src="/dashboards/shared/api.js"></script>
<script src="/dashboards/amazonas/app.js"></script>
</body>
</html>
