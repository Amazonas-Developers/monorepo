<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perimetrales · Dashboards ELDE</title>
<link rel="stylesheet" href="/dashboards/shared/estilo.css">
<style>:root { --acento: #e67e22; }</style>
</head>
<body>
<header>
  <h1>🛡️ Perimetrales — vigilancia del perímetro</h1>
  <span class="sub"><a href="/dashboards/" style="color:var(--apagado)">← todos los dashboards</a></span>
  <span class="refresco"></span>
</header>

<nav class="paneles" id="paneles"></nav>

<div class="kpis">
  <div class="kpi"><div class="valor" data-kpi="camaras">—</div><div class="nombre">cámaras del dominio</div></div>
  <div class="kpi"><div class="valor" data-kpi="frames">—</div><div class="nombre">frames recibidos</div></div>
  <div class="kpi"><div class="valor" data-kpi="modo">—</div><div class="nombre">validación</div></div>
  <div class="kpi"><div class="valor" data-kpi="problemas">—</div><div class="nombre">mensajes con problema</div></div>
</div>

<section>
  <h2>Cámaras perimetrales</h2>
  <div class="tarjeta" id="dispositivos"></div>
</section>

<section>
  <h2>Pipelines del contrato</h2>
  <div class="tarjeta" id="pipelines"></div>
</section>

<script src="/dashboards/shared/api.js"></script>
<script>
async function pintarPaneles() {
  const enlaces = await API.paneles();
  const nav = document.getElementById('paneles');
  const partes = [];
  if (enlaces.vigilante) partes.push(`<a href="${enlaces.vigilante}" target="_blank">🚨 Panel de VIGILANTE (alertas y galería)</a>`);
  nav.innerHTML = partes.join('');
}
pintarPaneles().catch(console.error);

// Los pipelines de este dominio, para separar "validado" de "pendiente".
const DEL_DOMINIO = ['perimetrales', 'perimetrales_botsort',
                     'perimetrales_multicam', 'vigilante_amazonas'];

refrescar(async () => {
  const [dispositivos, { contrato }] = await Promise.all([
    API.leer('dispositivos?client_type=perimetrales'),
    API.leer('estado'),
  ]);

  const filas = dispositivos.dispositivos;
  UI.kpis({
    camaras: dispositivos.total,
    frames: filas.reduce((s, d) => s + (d.frames || 0), 0),
    modo: contrato.modo,
    problemas: `${contrato.mensajes_con_problema_pct ?? '—'} %`,
  });

  UI.tabla('dispositivos', filas, [
    ['device_id', 'dispositivo'],
    ['camera_name', 'cámara'],
    ['pipelines', 'pipelines', v => UI.esc((v || []).join(', ') || '—')],
    ['frames', 'frames'],
    ['primera_vez', 'primera vez', v => UI.fecha(v)],
    ['ultima_vez', 'última vez', v => UI.fecha(v)],
  ]);

  const vistos = new Set(contrato.pipelines_observados || []);
  UI.tabla('pipelines', DEL_DOMINIO.map(p => ({ pipeline: p, visto: vistos.has(p) })), [
    ['pipeline', 'pipeline'],
    ['visto', 'estado', v => v
      ? '<span class="pill ok">validado</span>'
      : '<span class="pill aviso">sin tráfico aún</span>'],
  ]);
}, 15);
</script>
</body>
</html>
