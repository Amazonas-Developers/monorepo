[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elde-core"
version = "0.1.0"
description = "Nucleo compartido del ecosistema ELDE: contrato, transporte, captura y DVR"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
include = ["elde_core*"]
